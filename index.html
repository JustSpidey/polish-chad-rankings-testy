<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polish Chad Rankings & Community</title>

  <!-- Firebase SDKs (bez płatnego Storage) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg: radial-gradient(circle at top, #1e0c38 0%, #08070c 100%);
      --card-bg: #12111a;
      --purple-main: #a855f7;
      --purple-light: #c084fc;
      --purple-gradient: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%);
      --text: #ffffff;
      --subtext: #8e8d9f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #08070c; background-image: var(--bg); background-attachment: fixed; color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
    .app-container { width: 100%; max-width: 480px; padding-bottom: 32px; }

    header { position: sticky; top: 0; z-index: 1000; background: rgba(12, 10, 20, 0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(168, 85, 247, 0.15); padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
    .tabs { display: flex; justify-content: center; gap: 12px; }
    .tab { color: var(--subtext); text-decoration: none; font-weight: 700; font-size: 0.85rem; padding: 6px 12px; border-bottom: 2px solid transparent; cursor: pointer; }
    .tab.active { color: var(--text); border-bottom-color: var(--purple-main); }

    .content { padding: 16px; display: flex; flex-direction: column; gap: 20px; }
    
    .auth-card, .post-create-card, .post-card { background: var(--card-bg); border-radius: 14px; padding: 16px; border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 14px; }
    .auth-card input, .post-create-card textarea, .post-create-card input, .comment-input { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; padding: 10px; color: #fff; margin-bottom: 8px; font-size: 0.85rem; }
    .btn-action { width: 100%; background: var(--purple-gradient); border: none; border-radius: 8px; color: #fff; padding: 10px; font-weight: 700; cursor: pointer; }
    .auth-toggle { font-size: 0.75rem; color: var(--purple-light); text-align: center; margin-top: 8px; cursor: pointer; }
    
    .post-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--subtext); margin-bottom: 8px; }
    .post-author { color: var(--purple-light); font-weight: 700; }
    .post-text { font-size: 0.9rem; line-height: 1.4; margin-bottom: 8px; }
    .post-img { width: 100%; border-radius: 8px; margin-top: 6px; margin-bottom: 8px; max-height: 300px; object-fit: cover; }
    
    .post-actions { display: flex; gap: 10px; font-size: 0.75rem; margin-bottom: 8px; }
    .btn-link { color: var(--purple-light); cursor: pointer; background: none; border: none; font-size: 0.75rem; }
    .btn-delete { color: #ef4444; cursor: pointer; background: none; border: none; font-size: 0.75rem; }

    .comments-section { border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 8px; margin-top: 8px; }
    .comment-item { font-size: 0.8rem; background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; display: flex; flex-direction: column; }
    .comment-header { display: flex; justify-content: space-between; }
    .comment-author { color: var(--purple-light); font-weight: 600; }
    .file-input-label { display: block; font-size: 0.75rem; color: var(--subtext); margin-bottom: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1 style="text-align:center; font-size: 1rem;">POLISH CHAD COMMUNITY</h1>
      <div class="tabs">
        <span class="tab active" id="tab-rank" onclick="switchView('rankings')">📋 Rankingi</span>
        <span class="tab" id="tab-comm" onclick="switchView('community')">💬 Community</span>
      </div>
    </header>

    <main class="content">
      <div id="view-rankings">
        <p style="text-align: center; color: var(--subtext); font-size: 0.85rem;">Sekcja rankingowa działa bez zmian.</p>
      </div>

      <div id="view-community" style="display: none;">
        
        <div id="authContainer" class="auth-card">
          <h3 id="authTitle" style="margin-bottom: 10px; font-size: 0.95rem;">Logowanie</h3>
          <input type="text" id="authNick" placeholder="Twój Nick" style="display: none;">
          <input type="email" id="authEmail" placeholder="E-mail">
          <input type="password" id="authPassword" placeholder="Hasło">
          <button class="btn-action" id="btnAuthSubmit" onclick="handleAuth()">Zaloguj się</button>
          <div class="auth-toggle" onclick="toggleAuthMode()" id="authToggleText">Nie masz konta? Zarejestruj się</div>
        </div>

        <div id="userContainer" class="auth-card" style="display: none;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span>Zalogowano jako: <strong id="userDisplayName" style="color: var(--purple-light);">---</strong></span>
            <button onclick="logout()" style="background: none; border: none; color: #ef4444; cursor: pointer; font-weight: 700;">Wyloguj</button>
          </div>
        </div>

        <div id="postFormContainer" class="post-create-card" style="display: none;">
          <textarea id="postContent" rows="3" placeholder="Napisz coś na grupie..."></textarea>
          <label class="file-input-label">🖼️ Dodaj zdjęcie: <input type="file" id="postImage" accept="image/*"></label>
          <button class="btn-action" id="btnPostSubmit" onclick="createPost()">Opublikuj wpis</button>
        </div>

        <div id="postsFeed"></div>
      </div>
    </main>
  </div>

  <script>
    const ADMIN_EMAIL = "kplatek.2020@gmail.com";
    const IMGBB_API_KEY = "b2443cd9b7815f2f3e2909250ec3bce3";

    const firebaseConfig = {
      apiKey: "AIzaSyCJDcay4pyauLgGQLloTrf1kp2GjXoQmTA",
      authDomain: "polish-chad-rankings.firebaseapp.com",
      databaseURL: "https://polish-chad-rankings-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "polish-chad-rankings",
      storageBucket: "polish-chad-rankings.appspot.com",
      messagingSenderId: "941798583866",
      appId: "1:941798583866:web:d79633db32004e07c74f03"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    let isRegisterMode = false;
    let currentUser = null;

    function switchView(view) {
      document.getElementById('view-rankings').style.display = view === 'rankings' ? 'block' : 'none';
      document.getElementById('view-community').style.display = view === 'community' ? 'block' : 'none';
      document.getElementById('tab-rank').classList.toggle('active', view === 'rankings');
      document.getElementById('tab-comm').classList.toggle('active', view === 'community');
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('authTitle').innerText = isRegisterMode ? 'Rejestracja' : 'Logowanie';
      document.getElementById('authNick').style.display = isRegisterMode ? 'block' : 'none';
      document.getElementById('btnAuthSubmit').innerText = isRegisterMode ? 'Zarejestruj się' : 'Zaloguj się';
      document.getElementById('authToggleText').innerText = isRegisterMode ? 'Masz już konto? Zaloguj się' : 'Nie masz konta? Zarejestruj się';
    }

    function handleAuth() {
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;
      const nick = document.getElementById('authNick').value;

      if (!email || !password) return alert('Wypełnij e-mail i hasło!');

      if (isRegisterMode) {
        if (!nick) return alert('Wpisz swój nick!');
        auth.createUserWithEmailAndPassword(email, password)
          .then((cred) => cred.user.updateProfile({ displayName: nick }))
          .catch(err => alert('Błąd rejestracji: ' + err.message));
      } else {
        auth.signInWithEmailAndPassword(email, password)
          .catch(err => alert('Błąd logowania: ' + err.message));
      }
    }

    function logout() { auth.signOut(); }

    auth.onAuthStateChanged((user) => {
      currentUser = user;
      document.getElementById('authContainer').style.display = user ? 'none' : 'block';
      document.getElementById('userContainer').style.display = user ? 'block' : 'none';
      document.getElementById('postFormContainer').style.display = user ? 'block' : 'none';
      if (user) {
        const adminBadge = user.email === ADMIN_EMAIL ? ' (ADMIN)' : '';
        document.getElementById('userDisplayName').innerText = (user.displayName || user.email) + adminBadge;
      }
    });

    // Wszyty darmowy upload do ImgBB
    async function uploadImage(file) {
      if (!file) return null;

      const formData = new FormData();
      formData.append("image", file);

      const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: "POST",
        body: formData
      });

      const data = await response.json();
      if (data.success) {
        return data.data.url;
      } else {
        throw new Error("Błąd podczas przesyłania zdjęcia.");
      }
    }

    async function createPost() {
      const text = document.getElementById('postContent').value;
      const fileInput = document.getElementById('postImage');
      const file = fileInput.files[0];

      if (!text.trim() && !file) return alert('Napisz coś lub dodaj zdjęcie!');

      const btn = document.getElementById('btnPostSubmit');
      btn.innerText = 'Wysyłanie...';
      btn.disabled = true;

      try {
        const imageUrl = await uploadImage(file);
        await db.ref('posts').push({
          author: currentUser.displayName || 'Anonim',
          uid: currentUser.uid,
          userEmail: currentUser.email,
          text: text,
          imageUrl: imageUrl || null,
          timestamp: Date.now()
        });

        document.getElementById('postContent').value = '';
        fileInput.value = '';
      } catch (err) {
        alert('Błąd dodawania posta: ' + err.message);
      } finally {
        btn.innerText = 'Opublikuj wpis';
        btn.disabled = false;
      }
    }

    async function addComment(postId) {
      if (!currentUser) return alert('Musisz być zalogowany!');
      const input = document.getElementById(`comment-input-${postId}`);
      const fileInput = document.getElementById(`comment-img-${postId}`);
      const text = input.value;
      const file = fileInput.files[0];

      if (!text.trim() && !file) return;

      try {
        const imageUrl = await uploadImage(file);
        await db.ref(`posts/${postId}/comments`).push({
          author: currentUser.displayName || 'Anonim',
          uid: currentUser.uid,
          userEmail: currentUser.email,
          text: text,
          imageUrl: imageUrl || null,
          timestamp: Date.now()
        });
        input.value = '';
        fileInput.value = '';
      } catch (err) {
        alert('Błąd dodawania komentarza: ' + err.message);
      }
    }

    function deletePost(postId) {
      if (confirm('Czy na pewno chcesz usunąć ten post?')) {
        db.ref(`posts/${postId}`).remove();
      }
    }

    function deleteComment(postId, commentId) {
      if (confirm('Usunąć komentarz?')) {
        db.ref(`posts/${postId}/comments/${commentId}`).remove();
      }
    }

    async function translateText(elementId, originalText) {
      const el = document.getElementById(elementId);
      if (el.getAttribute('data-translated') === 'true') {
        el.innerText = originalText;
        el.setAttribute('data-translated', 'false');
        return;
      }

      el.innerText = 'Tłumaczenie...';
      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(originalText)}&langpair=Autodetect|pl`);
        const data = await res.json();
        if (data.responseData) {
          el.innerText = data.responseData.translatedText;
          el.setAttribute('data-translated', 'true');
        }
      } catch (e) {
        el.innerText = originalText;
        alert('Nie udało się przetłumaczyć.');
      }
    }

    db.ref('posts').on('value', (snapshot) => {
      const feed = document.getElementById('postsFeed');
      feed.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        feed.innerHTML = '<p style="text-align:center; color: var(--subtext); font-size:0.8rem;">Brak wpisów. Bądź pierwszy!</p>';
        return;
      }

      const postsArray = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();

      postsArray.forEach(post => {
        const dateStr = new Date(post.timestamp).toLocaleDateString() + ' ' + new Date(post.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        const isAdmin = currentUser && currentUser.email === ADMIN_EMAIL;
        const isOwner = currentUser && currentUser.uid === post.uid;
        
        const canDelete = isAdmin || isOwner;
        const deleteBtnHTML = canDelete ? `<button class="btn-delete" onclick="deletePost('${post.id}')">🗑️ Usuń</button>` : '';

        let commentsHTML = '';
        if (post.comments) {
          Object.keys(post.comments).forEach(cId => {
            const c = post.comments[cId];
            const canDeleteComm = isAdmin || (currentUser && currentUser.uid === c.uid);
            const delCommBtn = canDeleteComm ? `<span class="btn-delete" style="font-size:0.65rem;" onclick="deleteComment('${post.id}', '${cId}')">Usuń</span>` : '';
            const commImg = c.imageUrl ? `<img src="${c.imageUrl}" class="post-img">` : '';

            commentsHTML += `
              <div class="comment-item">
                <div class="comment-header">
                  <span class="comment-author">${c.author}</span>
                  ${delCommBtn}
                </div>
                <div>${c.text}</div>
                ${commImg}
              </div>`;
          });
        }

        const commentInputHTML = currentUser ? `
          <div style="margin-top:8px;">
            <div style="display:flex; gap:6px;">
              <input type="text" class="comment-input" id="comment-input-${post.id}" placeholder="Napisz komentarz..." style="margin:0;">
              <button onclick="addComment('${post.id}')" style="background:var(--purple-main); border:none; color:#fff; border-radius:6px; padding:0 12px; cursor:pointer; font-weight:700;">></button>
            </div>
            <label class="file-input-label" style="margin-top:4px;">📷 Zdjęcie: <input type="file" id="comment-img-${post.id}" accept="image/*"></label>
          </div>
        ` : '';

        const postImgHTML = post.imageUrl ? `<img src="${post.imageUrl}" class="post-img">` : '';

        const card = document.createElement('div');
        card.className = 'post-card';
        card.innerHTML = `
          <div class="post-header">
            <span class="post-author">${post.author}</span>
            <span>${dateStr}</span>
          </div>
          <div class="post-text" id="post-text-${post.id}">${post.text}</div>
          ${postImgHTML}
          <div class="post-actions">
            <button class="btn-link" onclick="translateText('post-text-${post.id}', '${post.text.replace(/'/g, "\\'")}')">🌐 Tłumacz / Oryginał</button>
            ${deleteBtnHTML}
          </div>
          <div class="comments-section">
            ${commentsHTML}
            ${commentInputHTML}
          </div>
        `;
        feed.appendChild(card);
      });
    });
  </script>
</body>
</html>
